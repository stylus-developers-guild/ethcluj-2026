name: Build and deploy kew site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out kew repo
        uses: actions/checkout@v4
        with:
          repository: uint23/kew
          path: kew

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install lowdown
        run: |
          sudo apt-get update
          sudo apt-get install -y lowdown

      - name: Build kew
        working-directory: kew
        run: go build -o kew .

      - name: Build site
        run: |
          mkdir -p public
          ./kew/kew site/blog public
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
