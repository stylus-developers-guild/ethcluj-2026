name: Build and deploy kew site

on:
  push:
    branches: ["trunk"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out site repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out kew repo
        uses: actions/checkout@v4
        with:
          repository: uint23/kew
          ref: 4043c2e310b3a2a6ef0e2120db1f1ea5b2384bef
          path: kew

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install lowdown
        run: |
          sudo apt-get update
          sudo apt-get install -y lowdown

      - name: Patch kew nav links to be relative
        working-directory: kew
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path("kew.go")
          s = p.read_text()

          file_pat = re.compile(
              r'p := f\.Path\s+if !strings\.HasPrefix\(p,\s*"/"\)\s*\{\s*p = "/" \+ p\s*\}',
              re.MULTILINE
          )
          dir_pat = re.compile(
              r'p := c\.Path\s+if !strings\.HasPrefix\(p,\s*"/"\)\s*\{\s*p = "/" \+ p\s*\}',
              re.MULTILINE
          )

          s, n1 = file_pat.subn('p := f.Path', s, count=1)
          s, n2 = dir_pat.subn('p := c.Path', s, count=1)

          if n1 != 1:
              sys.exit(f"Expected to patch file-link block once, patched {n1} times")
          if n2 != 1:
              sys.exit(f"Expected to patch directory-link block once, patched {n2} times")

          p.write_text(s)
          PY

      - name: Build kew
        working-directory: kew
        run: go build -o kew .

      - name: Build site
        run: |
          mkdir -p public
          ./kew/kew site/blog public
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
