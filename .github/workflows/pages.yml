- name: Check out site repo
  uses: actions/checkout@v4
  with:
    path: site

- name: Check out kew repo
  uses: actions/checkout@v4
  with:
    repository: uint23/kew
    ref: 4043c2e310b3a2a6ef0e2120db1f1ea5b2384bef
    path: kew

- name: Set up Go
  uses: actions/setup-go@v5
  with:
    go-version: "1.22"

- name: Install lowdown
  run: |
    sudo apt-get update
    sudo apt-get install -y lowdown

- name: Patch kew nav links to be relative
  working-directory: kew
  run: |
    python3 - <<'PY'
    from pathlib import Path
    import sys

    p = Path("kew.go")
    s = p.read_text()

    old1 = '''\t\tp := f.Path
\t\tif !strings.HasPrefix(p, "/") {
\t\t\tp = "/" + p
\t\t}
'''
    new1 = '''\t\tp := f.Path
'''

    old2 = '''\t\tp := d.Path
\t\tif !strings.HasPrefix(p, "/") {
\t\t\tp = "/" + p
\t\t}
'''
    new2 = '''\t\tp := d.Path
'''

    if old1 not in s:
        sys.exit("Did not find file-link nav block to patch")
    if old2 not in s:
        sys.exit("Did not find directory-link nav block to patch")

    s = s.replace(old1, new1)
    s = s.replace(old2, new2)

    p.write_text(s)
    PY

- name: Build kew
  working-directory: kew
  run: go build -o kew .

- name: Build site
  run: |
    mkdir -p public
    ./kew/kew site/blog public
    touch public/.nojekyll
