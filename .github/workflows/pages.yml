name: Build and deploy book

on:
  push:
    branches: ["trunk"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/requirements.txt

      - name: Set up Node (for mermaid-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Install Sphinx and dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML site
        run: make html

      - name: Build EPUB
        run: make epub

      - name: Build LaTeX source
        run: make latex

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/_build/latex
          root_file: ethcluj2026.tex

      - name: Collect outputs
        run: |
          mkdir -p docs/_build/html/downloads
          cp docs/_build/epub/*.epub docs/_build/html/downloads/ || true
          cp docs/_build/latex/*.pdf  docs/_build/html/downloads/ || true
          touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
