<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Arbitrum Workshop</title>

	<link rel="stylesheet" href="style.css" type="text/css">

	<!-- Prism theme -->
	<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet">
</head>

<body>

	<header>
		<h1><a href="index.html">Arbitrum Workshop</a></h1>
	</header>

	<nav id="side-bar">
		{{NAV}}
	</nav>

	<article id="page-content">
	{{CONTENT}}
	</article>

	<footer>
		<p>{{FOOTER}}</p>
	</footer>

	<aside id="chat-widget" aria-labelledby="chat-heading">
		<details id="chat-panel">
			<summary id="chat-heading">Ask this page</summary>

			<section id="chat-messages" aria-live="polite" aria-label="Chat messages"></section>

			<form id="chat-form">
				<label for="chat-input">Question</label>
				<input id="chat-input" type="text" placeholder="Ask about this page..." autocomplete="off">
				<button type="submit">Ask</button>
			</form>
		</details>
	</aside>

	<script src="chat.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-solidity.min.js"></script>

</body>
</html>
