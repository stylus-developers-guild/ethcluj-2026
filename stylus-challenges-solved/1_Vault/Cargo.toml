[package]
name = "cluj-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
stylus-sdk = "0.10.5"
alloy-sol-types = ">=0.0.0"

[dev-dependencies]
stylus-sdk = { version = "0.10.5", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "cluj-vault"
path = "src/main.rs"

[profile.release]
codegen-units = 1
opt-level = "z"
strip = true
lto = "fat"
debug = false
panic = "abort"
